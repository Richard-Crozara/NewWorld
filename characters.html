<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personagens — New World</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <header class="topbar">

        <a href="dashboard.html" class="brand">

            <div class="brand-symbol">

                <img
                    src="assets/images/arcane-symbol.png"
                    alt="Símbolo da Essência Arcana"
                >

            </div>

            <div class="brand-name">

                <span>NEW</span>
                <strong>WORLD</strong>

            </div>

        </a>


        <nav class="main-nav">

            <a href="dashboard.html" class="nav-link">
                Campanhas
            </a>

            <a
                href="characters.html"
                class="nav-link active"
            >
                Personagens
            </a>

            <a href="#" class="nav-link">
                Compêndio
            </a>

        </nav>


        <a
            href="#"
            class="login-link"
            id="logout-button"
        >
            Sair
        </a>

    </header>


    <main class="dashboard">

        <section class="dashboard-header">

            <span class="dashboard-overline">
                NEW WORLD
            </span>

            <h1>
                Seus personagens
            </h1>

            <p>
                Crie, organize e acompanhe seus personagens.
            </p>

        </section>


        <section
            class="campaign-grid"
            id="characters-grid"
        >

            <!-- Personagens reais aparecerão aqui -->


            <button
                type="button"
                class="create-campaign"
                id="open-create-character"
            >

                <span class="create-symbol">
                    +
                </span>

                <strong>
                    Criar personagem
                </strong>

                <span>
                    Comece uma nova história.
                </span>

            </button>

        </section>

    </main>


    <!-- MODAL DE CRIAÇÃO -->

    <div
        class="campaign-modal"
        id="create-character-modal"
        hidden
    >

        <div class="campaign-modal-content">

            <button
                type="button"
                class="campaign-modal-close"
                id="close-create-character"
                aria-label="Fechar"
            >
                ×
            </button>


            <span class="dashboard-overline">
                NEW WORLD
            </span>

            <h2>
                Criar personagem
            </h2>

            <p>
                Dê um nome ao seu novo personagem.
            </p>


            <form id="create-character-form">

                <div class="form-field">

                    <label for="character-name">
                        Nome do personagem
                    </label>

                    <input
                        type="text"
                        id="character-name"
                        maxlength="100"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    CRIAR PERSONAGEM
                </button>

            </form>

        </div>

    </div>


    <script src="js/app.js"></script>
    <script src="js/characters.js"></script>

</body>

</html>
