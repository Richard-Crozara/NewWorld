<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campanhas — New World</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <header class="topbar">

        <a href="index.html" class="brand">

            <div class="brand-symbol">

                <img
                    src="assets/images/arcane-symbol.png"
                    alt="Símbolo da Essência Arcana"
                >

            </div>

            <div class="brand-name">

                <span>NEW</span>
                <strong>WORLD</strong>

            </div>

        </a>

        <nav class="main-nav">

            <a href="dashboard.html" class="nav-link">
                Campanhas
            </a>

            <a href="#" class="nav-link">
                Personagens
            </a>

            <a href="#" class="nav-link">
                Compêndio
            </a>

        </nav>

        <a href="#" class="login-link" id="logout-button">
            Sair
        </a>

    </header>


    <main class="dashboard">

    <section class="dashboard-header">

        <span class="dashboard-overline">
            NEW WORLD
        </span>

        <span id="logged-user">
            Carregando...
        </span>

        <h1>
            Suas campanhas
        </h1>

            <p>
                Escolha uma aventura ou comece uma nova jornada.
            </p>

        </section>


        <section class="campaign-grid">

            <article class="campaign-card">

                <div class="campaign-card-top">

                    <span class="campaign-status">
                        ATIVA
                    </span>

                    <span class="campaign-members">
                        2 jogadores
                    </span>

                </div>

                <h2>
                    Aventura de Exemplo
                </h2>

                <p>
                    Uma campanha para testar as ferramentas do
                    New World.
                </p>

                <div class="campaign-footer">

                    <span>
                        Mestre: Você
                    </span>

                    <button>
                        ENTRAR
                    </button>

                </div>

            </article>


            <button class="create-campaign">

                <span class="create-symbol">
                    +
                </span>

                <strong>
                    Criar campanha
                </strong>

                <span>
                    Comece uma nova aventura.
                </span>

            </button>


            <button class="join-campaign">

                <span class="create-symbol">
                    ◇
                </span>

                <strong>
                    Entrar em campanha
                </strong>

                <span>
                    Use um código de convite.
                </span>

            </button>

        </section>

    </main>


    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script> 

</body>

</html>
