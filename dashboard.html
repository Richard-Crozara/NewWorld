<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campanhas — New World</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <header class="topbar">

        <a href="index.html" class="brand">

            <div class="brand-symbol">

                <img
                    src="assets/images/arcane-symbol.png"
                    alt="Símbolo da Essência Arcana"
                >

            </div>

            <div class="brand-name">

                <span>NEW</span>
                <strong>WORLD</strong>

            </div>

        </a>

        <nav class="main-nav">

            <a href="dashboard.html" class="nav-link">
                Campanhas
            </a>

            <a href="#" class="nav-link">
                Personagens
            </a>

            <a href="#" class="nav-link">
                Compêndio
            </a>

        </nav>

        <a href="#" class="login-link" id="logout-button">
            Sair
        </a>

    </header>


    <main class="dashboard">

    <section class="dashboard-header">

        <span class="dashboard-overline">
            NEW WORLD
        </span>

        <span id="logged-user">
            Carregando...
        </span>

        <h1>
            Suas campanhas
        </h1>

            <p>
                Escolha uma aventura ou comece uma nova jornada.
            </p>

        </section>


        <section class="campaign-grid">

        <!-- campanhas reais aparecerão aqui -->


            <button
                type="button"
                class="create-campaign"
                id="open-create-campaign"
            >

                <span class="create-symbol">
                    +
                </span>

                <strong>
                    Criar campanha
                </strong>

                <span>
                    Comece uma nova aventura.
                </span>

            </button>


            <button class="join-campaign">

                <span class="create-symbol">
                    ◇
                </span>

                <strong>
                    Entrar em campanha
                </strong>

                <span>
                    Use um código de convite.
                </span>

            </button>

        </section>

    </main>

    <div
    class="campaign-modal"
    id="create-campaign-modal"
    hidden
>
    <div class="campaign-modal-content">

        <button
            type="button"
            class="campaign-modal-close"
            id="close-create-campaign"
            aria-label="Fechar"
        >
            ×
        </button>

        <span class="dashboard-overline">
            NEW WORLD
        </span>

        <h2>
            Criar campanha
        </h2>

        <p>
            Dê um nome à sua nova aventura.
        </p>

        <form id="create-campaign-form">

            <div class="form-field">

                <label for="campaign-name">
                    Nome da campanha
                </label>

                <input
                    type="text"
                    id="campaign-name"
                    maxlength="100"
                    required
                >

            </div>

            <div class="form-field">

                <label for="campaign-description">
                    Descrição
                </label>

                <textarea
                    id="campaign-description"
                    rows="4"
                    placeholder="Opcional"
                ></textarea>

            </div>

            <button
                type="submit"
                class="login-button"
            >
                CRIAR CAMPANHA
            </button>

        </form>

    </div>
</div>

    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script> 

</body>

</html>
