<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campanha — New World</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <header class="topbar">

        <a href="dashboard.html" class="brand">

            <div class="brand-symbol">

                <img
                    src="assets/images/arcane-symbol.png"
                    alt="Símbolo da Essência Arcana"
                >

            </div>

            <div class="brand-name">

                <span>NEW</span>
                <strong>WORLD</strong>

            </div>

        </a>

        <nav class="main-nav">

            <a href="dashboard.html" class="nav-link">
                Campanhas
            </a>

            <a href="characters.html" class="nav-link">
                Personagens
            </a>

            <a href="#" class="nav-link">
                Compêndio
            </a>

        </nav>

        <a
            href="#"
            class="login-link"
            id="logout-button"
        >
            Sair
        </a>

    </header>

    <main class="dashboard">

        <section class="dashboard-header">

            <span class="dashboard-overline">
                CAMPANHA
            </span>

            <h1 id="campaign-name">
                Carregando campanha...
            </h1>

            <p id="campaign-description">
                Carregando informações...
            </p>

        </section>

        <section
            class="invite-section"
            id="invite-section"
            hidden
        >

            <span class="dashboard-overline">
                CONVIDAR JOGADORES
            </span>

            <h2>
                Código de convite
            </h2>

            <p>
                Compartilhe este código com os jogadores que deseja
                convidar para sua campanha.
            </p>

            <div class="invite-code-box">

                <strong id="invite-code">
                    Carregando...
                </strong>

                <button
                    type="button"
                    id="copy-invite-code"
                >
                    COPIAR
                </button>

            </div>

        </section>

    </main>

    <script src="js/campaign.js"></script>

</body>

</html>
