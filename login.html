<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar — New World</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <a href="index.html" class="login-brand">

                <img
                    src="assets/images/arcane-symbol.png"
                    alt="Símbolo da Essência Arcana"
                >

                <span>NEW WORLD</span>

            </a>

            <div class="login-heading">

                <span class="login-overline">
                    RPG SYSTEM
                </span>

                <h1>
                    Acessar conta
                </h1>

                <p>
                    Retorne à sua aventura.
                </p>

            </div>

            <form class="login-form">

                <div class="form-field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                    >

                </div>

                <div class="form-field">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Sua senha"
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>

            <div class="login-register">

                <span>
                    Ainda não possui uma conta?
                </span>

                <a href="#">
                    Criar conta
                </a>

            </div>

        </div>

    </main>

</body>

</html>
